  <style>
    /* Teaching-specific styles */
    .epic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 2rem; }
    .epic-card {
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: var(--radius); padding: 1.5rem 1.6rem;
      box-shadow: var(--shadow-sm); transition: all var(--transition);
      position: relative; overflow: hidden;
    }
    .epic-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .epic-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--accent); opacity: 0.7;
    }
    .epic-card__letter {
      font-family: var(--font-display); font-size: 2rem;
      color: var(--accent); line-height: 1; margin-bottom: 0.2rem;
    }
    .epic-card__title {
      font-weight: 600; font-size: 0.95rem; margin-bottom: 0.6rem; color: var(--ink);
    }
    .epic-card__text { font-size: 0.88rem; color: var(--ink-secondary); line-height: 1.65; }

    .quote-block {
      border-left: 3px solid var(--accent);
      padding: 0.8rem 1.2rem;
      margin: 1rem 0;
      background: var(--accent-subtle);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 0.88rem;
      font-style: italic;
      color: var(--ink-secondary);
      line-height: 1.6;
    }
    .quote-block cite {
      display: block; margin-top: 0.4rem;
      font-style: normal; font-size: 0.78rem; color: var(--ink-muted);
    }

    .stats-row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1.5rem 0; }
    .stat-item {
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: var(--radius); padding: 1rem 1.4rem; text-align: center;
      flex: 1; min-width: 140px; box-shadow: var(--shadow-sm);
    }
    .stat-item__number {
      font-family: var(--font-display); font-size: 1.6rem; color: var(--accent);
      line-height: 1.2;
    }
    .stat-item__label { font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.2rem; }

    .video-table {
      width: 100%; border-collapse: collapse; font-size: 0.88rem; margin: 1rem 0;
    }
    .video-table th {
      text-align: left; padding: 0.6rem 0.8rem;
      border-bottom: 2px solid var(--border); font-weight: 600;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--ink-muted);
    }
    .video-table td {
      padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--border-light);
      color: var(--ink-secondary);
    }
    .video-table tr:hover td { background: var(--accent-subtle); }
    .video-table a { font-weight: 500; }

    .resource-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.03em; padding: 0.3rem 0.7rem;
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--ink-secondary); transition: all var(--transition);
    }
    .resource-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }

    @media (max-width: 600px) { .epic-grid { grid-template-columns: 1fr; } }
  </style>
